<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Full Screen Canvas -->
  <rect width="1080" height="1920" fill="url(#phoneBg)" />

  <!-- Android Status Bar (#0F172A) -->
  <rect width="1080" height="64" fill="#0f172a" />
  <text x="48" y="42" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="600">10:00</text>
  <g transform="translate(940, 24)">
    <!-- Battery & Signal Icons Mock -->
    <rect x="0" y="6" width="30" height="16" rx="4" fill="none" stroke="#f8fafc" stroke-width="2" />
    <rect x="2" y="8" width="22" height="12" rx="2" fill="#22c55e" />
    <rect x="31" y="11" width="3" height="6" rx="1" fill="#f8fafc" />
    <path d="M 50 20 L 50 10 L 60 20 Z" fill="#f8fafc" />
  </g>

  <!-- App Header Navigation Bar -->
  <rect y="64" width="1080" height="120" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <g transform="translate(48, 88)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="#2563eb" />
    <path d="M 36 20 L 56 32 L 36 44 L 16 32 Z" fill="#ffffff" />
    <path d="M 24 38 L 24 50 Q 36 56 48 50 L 48 38" fill="none" stroke="#ffffff" stroke-width="3" />
    <text x="96" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="800">অগ্রযাত্রা | Ogrojatra</text>
    <text x="96" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18" font-weight="600">এইচএসসি বিজ্ঞান (HSC Science)</text>
  </g>

  <!-- Header Banner Section -->
  <g transform="translate(48, 224)">
    <rect width="984" height="260" rx="32" fill="#1e1b4b" stroke="#4338ca" stroke-width="2" />
    <text x="48" y="64" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">TODAY'S ADAPTIVE PRACTICE</text>
    <text x="48" y="120" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="800">পদার্থবিজ্ঞান — ভেক্টর ও গতিবিদ্যা</text>
    <text x="48" y="165" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="22">ঢাকা ও চট্টগ্রাম বোর্ড বিগত বছরের প্রামাণিক প্রশ্নমালা</text>
    <rect x="48" y="195" width="220" height="44" rx="22" fill="#2563eb" />
    <text x="158" y="223" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">অনুশীলন শুরু করুন</text>
  </g>

  <!-- Socratic AI Tutor Card -->
  <g transform="translate(48, 520)">
    <rect width="984" height="340" rx="32" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <rect x="48" y="40" width="48" height="48" rx="14" fill="#8b5cf6" />
    <text x="116" y="62" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="700">অগ্রযাত্রা সক্রেটিক টিউটর</text>
    <text x="116" y="86" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Google Gemini 2.0 Flash Powered</text>

    <!-- AI Dialogue Bubble -->
    <rect x="48" y="115" width="888" height="120" rx="20" fill="#1e293b" />
    <text x="80" y="155" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="20" font-weight="500">
      "চমৎকার চেষ্টা! প্রাসের সর্বোচ্চ উচ্চতার সমীকরণ \( H = \frac{v_0^2 \sin^2\theta}{2g} \) মনে আছে কি?
    </text>
    <text x="80" y="195" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="18" font-weight="600">
      এখানে \(\theta = 45^\circ\) হলে \(H\) এর মান কীভাবে পরিবর্তিত হবে?"
    </text>

    <!-- Quick Hint Trigger Buttons -->
    <rect x="48" y="260" width="160" height="48" rx="16" fill="#334155" />
    <text x="128" y="291" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">সূত্র দেখুন</text>
    <rect x="224" y="260" width="200" height="48" rx="16" fill="#334155" />
    <text x="324" y="291" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">পরবর্তী সংকেত (Hint)</text>
  </g>

  <!-- 3D STEM Virtual Labs Showcase Card -->
  <g transform="translate(48, 895)">
    <rect width="984" height="420" rx="32" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <text x="48" y="60" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="700">INTERACTIVE 3D STEM LABS</text>
    <text x="48" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="30" font-weight="800">ভার্চুয়াল পদার্থবিজ্ঞান ক্যানন সিমুলেটর</text>

    <!-- Canvas Simulation Area Mock -->
    <rect x="48" y="135" width="888" height="200" rx="20" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
    <!-- Parabola Trajectory Curve -->
    <path d="M 80 300 Q 450 160 880 300" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="10 8" />
    <circle cx="80" cy="300" r="14" fill="#f59e0b" />
    <circle cx="480" cy="230" r="10" fill="#22c55e" />
    <circle cx="880" cy="300" r="12" fill="#ef4444" />
    <!-- Telemetry Badges -->
    <rect x="70" y="155" width="240" height="36" rx="10" fill="#0f172a" opacity="0.9" />
    <text x="85" y="179" fill="#94a3b8" font-family="monospace" font-size="14">Angle: 45° | v0: 40 m/s</text>

    <!-- Lab Launch CTA -->
    <rect x="48" y="355" width="888" height="48" rx="16" fill="#2563eb" />
    <text x="492" y="386" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">সরাসরি থ্রি-ডি ল্যাবে প্রবেশ করুন</text>
  </g>

  <!-- Proof-of-Skill Certificate Preview -->
  <g transform="translate(48, 1345)">
    <rect width="984" height="280" rx="32" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="48" y="55" fill="#22c55e" font-family="system-ui, sans-serif" font-size="16" font-weight="700">W3C VERIFIED CREDENTIALS</text>
    <text x="48" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800">ডিজিটাল সনদের বৈধতা ও কিউআর ভেরিফিকেশন</text>
    <text x="48" y="140" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="18">এক ক্লিকে লিঙ্কডইন ও ফেসবুকে প্রুফ-অব-স্কিল কার্ড শেয়ার করুন।</text>
    <g transform="translate(48, 175)">
      <rect width="260" height="44" rx="14" fill="#0a66c2" />
      <text x="130" y="203" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Share on LinkedIn</text>
      <rect x="280" y="0" width="260" height="44" rx="14" fill="#1877f2" />
      <text x="410" y="203" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Share on Facebook</text>
    </g>
  </g>

  <!-- Android Navigation Bar (#0F172A) -->
  <rect y="1840" width="1080" height="80" fill="#0f172a" />
  <g transform="translate(480, 1870)">
    <!-- Standard Android Home Pill -->
    <rect x="-60" y="0" width="120" height="8" rx="4" fill="#64748b" />
  </g>
</svg>
