<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Slate Outer Canvas -->
  <rect width="1024" height="500" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="180" fill="#2563eb" opacity="0.12" filter="url(#glow)" />
  <circle cx="850" cy="350" r="220" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80" x2="1024" y2="80" />
    <line x1="0" y1="420" x2="1024" y2="420" />
    <line x1="120" y1="0" x2="120" y2="500" />
    <line x1="904" y1="0" x2="904" y2="500" />
  </g>

  <!-- Outer Dignified Border -->
  <rect x="24" y="24" width="976" height="452" rx="20" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Left Content: Brand Header & Value Proposition -->
  <g transform="translate(80, 110)">
    <!-- Crest Icon -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#2563eb" />
    <path d="M 28 16 L 44 26 L 28 36 L 12 26 Z" fill="#ffffff" />
    <path d="M 18 31 L 18 40 Q 28 45 38 40 L 38 31" fill="none" stroke="#ffffff" stroke-width="2.5" />

    <!-- Brand Typography -->
    <text x="76" y="28" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5">অগ্রযাত্রা | OGROJATRA</text>
    <text x="76" y="50" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">NATIONAL STUDENT LIFE CIRCLE</text>

    <!-- Main Headline -->
    <text x="0" y="115" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      বাংলাদেশের সমন্বিত শিক্ষা ও অগ্রগতি প্ল্যাটফর্ম
    </text>
    <text x="0" y="150" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600">
      Academic Excellence, 3D STEM Labs &amp; Socratic AI
    </text>

    <!-- Pillar Feature Pills -->
    <g transform="translate(0, 185)">
      <!-- Pill 1: NCTB & Admission -->
      <g transform="translate(0, 0)">
        <rect width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <circle cx="18" cy="18" r="5" fill="#22c55e" />
        <text x="32" y="23" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">NCTB &amp; Admission</text>
      </g>
      <!-- Pill 2: 3D STEM Labs -->
      <g transform="translate(182, 0)">
        <rect width="145" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <circle cx="18" cy="18" r="5" fill="#38bdf8" />
        <text x="32" y="23" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">3D STEM Labs</text>
      </g>
      <!-- Pill 3: Socratic AI -->
      <g transform="translate(339, 0)">
        <rect width="145" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <circle cx="18" cy="18" r="5" fill="#a855f7" />
        <text x="32" y="23" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Socratic AI</text>
      </g>
      <!-- Pill 4: W3C Credentials -->
      <g transform="translate(496, 0)">
        <rect width="165" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <circle cx="18" cy="18" r="5" fill="#eab308" />
        <text x="32" y="23" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">W3C Credentials</text>
      </g>
    </g>
  </g>

  <!-- Right Decorative App Mockup / Card Preview -->
  <g transform="translate(740, 100)">
    <rect width="210" height="300" rx="24" fill="#0f172a" stroke="#2563eb" stroke-width="2" filter="url(#glow)" />
    <!-- Notch & Header Mock -->
    <rect x="70" y="10" width="70" height="6" rx="3" fill="#334155" />
    <rect x="20" y="30" width="170" height="40" rx="10" fill="#1e293b" />
    <rect x="20" y="80" width="170" height="85" rx="12" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
    <text x="32" y="105" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">HSC PHYSICS MCQ</text>
    <text x="32" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">গতিবিদ্যা ও মহাকর্ষ</text>
    <rect x="32" y="138" width="146" height="18" rx="6" fill="#22c55e" opacity="0.2" />
    <text x="40" y="151" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Score: 98.5% | Top 1.5%</text>

    <!-- Mini Action Button Mock -->
    <rect x="20" y="180" width="170" height="32" rx="8" fill="#2563eb" />
    <text x="105" y="200" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">অনুশীলন শুরু করুন</text>
    <rect x="20" y="222" width="170" height="60" rx="10" fill="#1e293b" />
  </g>
</svg>
