<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- Android Adaptive Icon: 108x108 dp (72dp safe zone in center) -->
  <defs>
    <linearGradient id="adaptiveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="108" height="108" fill="url(#adaptiveBg)" />

  <!-- Foreground Layer (Safe Area: 18,18 to 90,90) -->
  <g transform="translate(18, 18)">
    <!-- Mortarboard Top -->
    <path d="M 36 12 L 64 24 L 36 36 L 8 24 Z" fill="#ffffff" />
    <!-- Cap Base -->
    <path d="M 18 30 L 18 44 Q 36 54 54 44 L 54 30" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <!-- Tassel -->
    <path d="M 64 24 L 64 44" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="64" cy="46" r="2.5" fill="#fbbf24" />
  </g>
</svg>
