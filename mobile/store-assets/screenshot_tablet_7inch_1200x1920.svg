<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1920" width="1200" height="1920">
  <defs>
    <linearGradient id="tab7Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="1920" fill="url(#tab7Bg)" />

  <!-- Status Bar -->
  <rect width="1200" height="64" fill="#0f172a" />
  <text x="56" y="42" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="600">10:00</text>
  <text x="1110" y="42" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="600">95%</text>

  <!-- Header -->
  <rect y="64" width="1200" height="120" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <g transform="translate(56, 92)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="#2563eb" />
    <path d="M 32 18 L 50 28 L 32 38 L 14 28 Z" fill="#ffffff" />
    <text x="88" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="30" font-weight="800">অগ্রযাত্রা | Ogrojatra 7-inch Tablet Hub</text>
    <text x="88" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Split View: 3D STEM Visualizer &amp; Socratic AI Assistant</text>
  </g>

  <!-- Split Screen View Mock: Left Column (3D STEM Lab) -->
  <g transform="translate(56, 224)">
    <rect width="520" height="1560" rx="28" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <text x="40" y="60" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="700">3D STEM MOLECULAR VIEWER</text>
    <text x="40" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="800">মিথেন (\(CH_4\)) অণুর গঠন</text>
    
    <!-- 3D Ball-and-Stick Geometry Mock -->
    <rect x="40" y="130" width="440" height="400" rx="20" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="260" cy="330" r="44" fill="#334155" />
    <text x="260" y="340" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">C</text>
    <!-- Bond Lines & Hydrogens -->
    <line x1="260" y1="286" x2="260" y2="200" stroke="#94a3b8" stroke-width="8" />
    <circle cx="260" cy="180" r="26" fill="#38bdf8" />
    <line x1="225" y1="355" x2="160" y2="420" stroke="#94a3b8" stroke-width="8" />
    <circle cx="140" cy="440" r="26" fill="#38bdf8" />
    <line x1="295" y1="355" x2="360" y2="420" stroke="#94a3b8" stroke-width="8" />
    <circle cx="380" cy="440" r="26" fill="#38bdf8" />

    <!-- Parametric Controls -->
    <g transform="translate(40, 560)">
      <rect width="440" height="60" rx="14" fill="#1e293b" />
      <text x="24" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16">Bond Angle: 109.5° (Tetrahedral)</text>
      <rect y="80" width="440" height="60" rx="14" fill="#1e293b" />
      <text x="24" y="116" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16">Hybridization: \(sp^3\) Orbital</text>
    </g>
  </g>

  <!-- Split Screen View Mock: Right Column (Socratic AI Chat Stream) -->
  <g transform="translate(624, 224)">
    <rect width="520" height="1560" rx="28" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <text x="40" y="60" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="18" font-weight="700">SOCRATIC AI TUTOR</text>
    <text x="40" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="800">রিয়েল-টাইম নির্দেশিকা</text>

    <!-- Chat Messages -->
    <g transform="translate(40, 130)">
      <!-- AI Bubble -->
      <rect width="440" height="150" rx="20" fill="#1e293b" />
      <text x="24" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="500">
        "মিথেনের চারটি C-H বন্ধন একে অপরের থেকে
      </text>
      <text x="24" y="74" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="500">
        সর্বোচ্চ দূরত্বে অবস্থান করে। একে VSEPR তত্ত্বে
      </text>
      <text x="24" y="104" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="16" font-weight="600">
        চতুস্তলকীয় (Tetrahedral) বলা হয়।"
      </text>

      <!-- Student Reply -->
      <rect y="170" x="100" width="340" height="80" rx="20" fill="#2563eb" />
      <text x="124" y="216" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16">তাহলে পানির বন্ধন কোণ কত?</text>

      <!-- AI Socratic Follow-up -->
      <rect y="270" width="440" height="170" rx="20" fill="#1e293b" />
      <text x="24" y="310" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16">
        "খুব ভালো প্রশ্ন! পানির ক্ষেত্রে অক্সিজেনে দুটি
      </text>
      <text x="24" y="340" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16">
        মুক্তজোড় ইলেকট্রন (Lone Pair) থাকে।
      </text>
      <text x="24" y="370" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="16" font-weight="600">
        মুক্তজোড়ের বিকর্ষণে কোণটি কমে কত ডিগ্রিতে দাঁড়ায়?"
      </text>
    </g>
  </g>

  <!-- Android Navigation Bar (#0F172A) -->
  <rect y="1840" width="1200" height="80" fill="#0f172a" />
  <g transform="translate(540, 1870)">
    <rect x="-60" y="0" width="120" height="8" rx="4" fill="#64748b" />
  </g>
</svg>
