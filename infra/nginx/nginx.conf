# ========================================================================================
# DEVELOPER ARCHITECTURE NOTE - PRODUCTION NGINX REVERSE PROXY & HTTP/3 (QUIC):
# MODULE:    Edge Reverse Proxy, HTTP/3 QUIC Gateway & WebSocket Multiplexer
# TOPIC:     TLS 1.3 Termination, Zero-Downtime Routing, WebSocket Upgrade & DDoS Guard
# FILE:      infra/nginx/nginx.conf
# PHASE:     Phase 100 - Grand Public Launch
# PURPOSE:   Enforces high-availability edge routing for the Student Growth Platform:
#            1. HTTP/3 (QUIC): Employs UDP 443 with Alt-Svc headers for ultra-low latency
#               on packet-loss-prone 2G/3G/4G cellular networks across Bangladesh.
#            2. WebSocket Upgrade: Binds low-latency bi-directional connections for Live
#               Challenge real-time rooms and WebRTC signaling (/ws/).
#            3. Upstream Routing: Segregates traffic between Next.js frontend (port 3000)
#               and FastAPI async backend (port 8000).
#            4. Security Headers: Ingresses HSTS 63072000, nosniff, DENY, and rate limiters.
# AUDIENCE:  DevOps Engineers, SRE Leads, Cloud Network Architects & AI Agents
# STANDARDS: IETF RFC 9114 (HTTP/3), NIST SP 800-52, OWASP ASVS L2, Zero-Emoji Spec
# ========================================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Buffers & Timeouts
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip & Compression Tuning for Mobile Networks
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Ingress Rate Limiting Zones (Leaky Bucket)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream Clusters
    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # HTTP to HTTPS Global Redirector
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name ogrojatra.edu.bd www.ogrojatra.edu.bd;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # Production SSL Server with HTTP/3 (QUIC) & WebSocket Multiplexing
    # -------------------------------------------------------------------------
    server {
        # Standard HTTPS TCP
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        # HTTP/3 QUIC UDP
        listen 443 quic reuseport;
        listen [::]:443 quic reuseport;

        server_name ogrojatra.edu.bd www.ogrojatra.edu.bd;

        # SSL Certificates & Strict Ciphers
        ssl_certificate /etc/nginx/ssl/live/ogrojatra.edu.bd/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/ogrojatra.edu.bd/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HTTP/3 Advertisement Header
        add_header Alt-Svc 'h3=":443"; ma=86400';
        add_header X-Quic 'h3' always;

        # OWASP ASVS L2 Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # 1. API & Backend Route Proxy
        location /api/v1/ {
            limit_req zone=api_limit burst=30 nodelay;
            limit_conn conn_limit 50;

            proxy_pass http://backend_upstream/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # 2. Real-Time WebSocket Upgrades (/ws/)
        location /ws/ {
            proxy_pass http://backend_upstream/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 3. Prometheus Metrics Scraping Endpoint (Internal / Protected)
        location /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://backend_upstream/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # 4. Next.js Static Optimization & PWA Client
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # 5. Service Worker & PWA Manifest Cache Policies
        location = /sw.js {
            proxy_pass http://frontend_upstream/sw.js;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location = /manifest.json {
            proxy_pass http://frontend_upstream/manifest.json;
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        }
    }
}
