# ========================================================================================
# DEVELOPER ARCHITECTURE NOTE - GRAFANA PROMETHEUS DATASOURCE PROVISIONING:
# MODULE:    Grafana Automatic Datasource Provisioning
# TOPIC:     Prometheus Scraper Connection Configuration
# FILE:      infra/grafana/provisioning/datasources/prometheus.yml
# PURPOSE:   Automatically connects Grafana to the in-network Prometheus server:
#            1. Name: Ogrojatra Prometheus (UID: ogrojatra-prometheus).
#            2. Access: Proxy mode via internal container network.
#            3. Default: Set as default dashboard data source.
# AUDIENCE:  DevOps Engineers, SREs & AI Agents
# STANDARDS: Grafana Datasource Provisioning v1, Zero-Emoji Spec
# ========================================================================================

apiVersion: 1

datasources:
  - name: Ogrojatra Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    uid: ogrojatra-prometheus
    url: http://prometheus:9090
    isDefault: true
    version: 1
    editable: false
    jsonData:
      timeInterval: 10s
      httpMethod: POST
