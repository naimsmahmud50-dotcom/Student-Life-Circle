# ========================================================================================
# DEVELOPER ARCHITECTURE NOTE - KUBERNETES BACKEND DEPLOYMENT & SERVICE:
# MODULE:    Kubernetes Workload Specification for FastAPI Engine
# TOPIC:     Stateless Microservice Deployment, Rolling Updates, Horizontal Pod Autoscaling
# FILE:      infra/k8s/backend-deployment.yaml
# PURPOSE:   Manages the lifecycle of the Python FastAPI Core API pods:
#            1. Zero-Downtime Rolling Update: maxSurge: 1, maxUnavailable: 0 guarantees
#               that traffic is only routed to newly spawned pods after passing readiness.
#            2. Hard Security Context: Runs under UID 10001 non-root, read-only rootfs,
#               dropped Linux capabilities (ALL), and no privilege escalation.
#            3. Probes: HTTP liveness and readiness probes verify system viability and
#               database connectivity before taking ingress traffic.
#            4. Horizontal Pod Autoscaler (HPA): Automatically scales pods between 2 and 10
#               replicas based on CPU and memory thresholds.
# AUDIENCE:  DevOps Engineers, Kubernetes Administrators, SREs & AI Agents
# STANDARDS: Kubernetes v1.28+, CIS Kubernetes Benchmark, Zero-Emoji Spec
# ========================================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ogrojatra-backend
  namespace: ogrojatra-production
  labels:
    app.kubernetes.io/name: ogrojatra-backend
    app.kubernetes.io/component: api-server
    app.kubernetes.io/part-of: student-growth-platform
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ogrojatra-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ogrojatra-backend
        app.kubernetes.io/component: api-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fastapi-server
          image: ghcr.io/student-life-circle/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-api
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ogrojatra-config
            - secretRef:
                name: ogrojatra-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: ogrojatra-backend-service
  namespace: ogrojatra-production
  labels:
    app.kubernetes.io/name: ogrojatra-backend
    app.kubernetes.io/component: api-server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: ogrojatra-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ogrojatra-backend-hpa
  namespace: ogrojatra-production
  labels:
    app.kubernetes.io/name: ogrojatra-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ogrojatra-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
