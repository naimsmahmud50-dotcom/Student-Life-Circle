# ========================================================================================
# DEVELOPER ARCHITECTURE NOTE - KUBERNETES ENVIRONMENT CONFIGURATION & SECRETS:
# MODULE:    Kubernetes ConfigMap and Secret Declarations
# TOPIC:     Application Environment Injection, Secrets Isolation, Pod Configuration
# FILE:      infra/k8s/configmap-secrets.yaml
# PURPOSE:   Defines Kubernetes ConfigMap and Secret templates for the Ogrojatra platform:
#            1. ConfigMap (ogrojatra-config): Injects non-sensitive environment variables
#               such as ENVIRONMENT, PROJECT_NAME, API prefix, and CORS origins.
#            2. Secret (ogrojatra-secrets): Injects sensitive credentials including
#               DATABASE_URL, REDIS_URL, SECRET_KEY, SENTRY_DSN, and payment API keys.
# AUDIENCE:  DevOps Engineers, Kubernetes Administrators, SREs & AI Agents
# STANDARDS: Kubernetes v1.28+, 12-Factor App, CIS Kubernetes Benchmark, Zero-Emoji Spec
# ========================================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: ogrojatra-config
  namespace: ogrojatra-production
  labels:
    app.kubernetes.io/name: ogrojatra
    app.kubernetes.io/part-of: student-growth-platform
    app.kubernetes.io/environment: production
data:
  ENVIRONMENT: "production"
  PROJECT_NAME: "Student Growth Platform"
  VERSION: "1.0.0"
  API_V1_STR: "/api/v1"
  BACKEND_CORS_ORIGINS: '["https://ogrojatra.edu.bd","https://www.ogrojatra.edu.bd"]'
  LOG_LEVEL: "INFO"
  ENABLE_RATE_LIMITING: "true"
  METRICS_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: ogrojatra-secrets
  namespace: ogrojatra-production
  labels:
    app.kubernetes.io/name: ogrojatra
    app.kubernetes.io/part-of: student-growth-platform
    app.kubernetes.io/environment: production
type: Opaque
stringData:
  # In production, values are injected via SealedSecrets, HashiCorp Vault, or External Secrets Operator
  DATABASE_URL: "postgresql+asyncpg://ogrojatra_admin:CHANGE_ME_PRODUCTION_DB_PASSWORD@postgres-service.ogrojatra-production.svc.cluster.local:5432/ogrojatra_prod_db"
  REDIS_URL: "redis://:CHANGE_ME_PRODUCTION_REDIS_PASSWORD@redis-service.ogrojatra-production.svc.cluster.local:6379/0"
  SECRET_KEY: "CHANGE_ME_PRODUCTION_APPLICATION_SECRET_KEY_MIN_64_CHARACTERS"
  SENTRY_DSN: "https://production-public-key@sentry.ogrojatra.edu.bd/1"
  BKASH_APP_KEY: "CHANGE_ME_BKASH_PRODUCTION_APP_KEY"
  BKASH_APP_SECRET: "CHANGE_ME_BKASH_PRODUCTION_APP_SECRET"
  NAGAD_PRIVATE_KEY: "CHANGE_ME_NAGAD_PRODUCTION_PRIVATE_KEY"
